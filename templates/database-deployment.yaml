apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-database
  namespace: bank-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-database
  template:
    metadata:
      labels:
        app: bank-database
    spec:
      securityContext:
        fsGroup: 1000670000
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: secretpassword
        - name: POSTGRES_INITDB_ARGS
          value: "--auth-host=scram-sha-256"
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 999
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-storage
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: bank-database-pvc
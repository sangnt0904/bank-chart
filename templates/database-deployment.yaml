apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-database
  namespace: bank-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-database
  template:
    metadata:
      labels:
        app: bank-database
    spec:
      securityContext:
        fsGroup: 1000670000 # Khớp với dải UID của namespace trên OpenShift
      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_PASSWORD
          value: secretpassword
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 999
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-storage
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: bank-database-pvc